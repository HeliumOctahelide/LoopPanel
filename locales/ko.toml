# LoopPanel UI 메시지: 한국어.
# 자리표시자는 {name} 형식이며, 키와 자리표시자는 en.toml과 같아야 합니다.

[tray.status]
connecting = "LoopPanel: 연결 중"
running = "LoopPanel: 실행 중"
exiting = "LoopPanel: 종료 중"
