# Three original samples are bundled; you can also use your own PNG, JPEG or GIF.
background = "samples/aurora-circuit.jpg"

# Background, template and relative font paths are resolved against this file's directory.
template = "dashboard.svg.jinja"
# Uses Bahnschrift, which ships with Windows 10/11, by default; any other local TTF/TTC font works too.
font = 'C:\Windows\Fonts\bahnschrift.ttf'
title = "LoopPanel"
custom_lines = []

# GIFs keep their own frame timing; fps is the animation cap, from 1 to 30.
fps = 5
# Hardware sampling period; the default is 1 Hz.
sensor_interval_ms = 1000
brightness = 0.90
show_clock = true
show_sensors = true
